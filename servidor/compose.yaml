name: eventosports-s7
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventosports
      POSTGRES_DB: eventosports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en servidor/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventosports -d eventosports"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
